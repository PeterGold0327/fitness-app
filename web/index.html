<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07090b" />
  <title>多多 Fitness</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="v2.css" />
  <link rel="stylesheet" href="cloud.css" />
  <link rel="stylesheet" href="workout.css" />
  <link rel="stylesheet" href="food-photo.css" />
  <link rel="stylesheet" href="history.css" />
  <link rel="stylesheet" href="calendar.css" />
  <link rel="stylesheet" href="ui-refresh.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">PERSONAL FITNESS AGENT</div>
        <h1 id="greeting">晚上好，多多</h1>
        <div id="todayDate" class="muted"></div>
      </div>
      <button id="quickAdd" class="icon-btn" aria-label="拍照记录饮食">📷</button>
    </header>

    <main id="app"></main>

    <nav class="tabbar" aria-label="主导航">
      <button data-tab="home" class="tab active">⌂<span>今天</span></button>
      <button data-tab="nutrition" class="tab">◎<span>营养</span></button>
      <button type="button" class="capture-tab" onclick="openMeal()" aria-label="拍照记录饮食">📷<span>拍照</span></button>
      <button data-tab="training" class="tab">▦<span>日历</span></button>
      <button data-tab="progress" class="tab">↗<span>进展</span></button>
      <button data-tab="settings" class="tab">⚙<span>设置</span></button>
    </nav>
  </div>

  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-card">
      <button class="modal-close" value="cancel">×</button>
      <div id="modalBody"></div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cloud-config.js"></script>
  <script src="app-v2.js"></script>
  <script src="macro-tracking.js"></script>
  <script src="workout-tracking.js"></script>
  <script src="activity-history.js"></script>
  <script src="cloud-sync.js"></script>
  <script src="food-photo.js"></script>
  <script src="history-view.js"></script>
  <script src="calendar-view.js"></script>
  <script src="watch-strength-merge.js"></script>
  <script src="iphone-import.js"></script>
</body>
</html>
