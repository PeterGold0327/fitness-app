<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d0e" />
  <title>多多 Fitness</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="v2.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">PERSONAL FITNESS AGENT</div>
        <h1 id="greeting">晚上好，多多</h1>
        <div id="todayDate" class="muted"></div>
      </div>
      <button id="quickAdd" class="icon-btn" aria-label="快速记录">＋</button>
    </header>

    <main id="app"></main>

    <nav class="tabbar" aria-label="主导航">
      <button data-tab="home" class="tab active">⌂<span>首页</span></button>
      <button data-tab="nutrition" class="tab">🍴<span>营养</span></button>
      <button data-tab="training" class="tab">🏋<span>运动</span></button>
      <button data-tab="progress" class="tab">↗<span>进展</span></button>
      <button data-tab="settings" class="tab">⚙<span>设置</span></button>
    </nav>
  </div>

  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-card">
      <button class="modal-close" value="cancel">×</button>
      <div id="modalBody"></div>
    </form>
  </dialog>

  <script src="app-v2.js"></script>
  <script src="macro-tracking.js"></script>
</body>
</html>
